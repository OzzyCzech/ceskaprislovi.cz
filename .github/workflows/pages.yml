name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          # Open Graph PNGs of all proverbs; only new or changed proverbs are rendered on a partial hit.
          path: .cache/og
          key: og-images-${{ hashFiles('src/lib/og-image.ts', 'src/lib/wrap-text.ts', 'src/assets/fonts/*') }}-${{ hashFiles('src/data/prislovi.json', 'src/data/zneni.json') }}
          restore-keys: og-images-${{ hashFiles('src/lib/og-image.ts', 'src/lib/wrap-text.ts', 'src/assets/fonts/*') }}-
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
          include-hidden-files: true # keeps .well-known (Bluesky verification) in the artifact

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
